<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад занять</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>Розклад занять</h1>

    <div class="schedule-form">
        <div class="input-group">
            <label for="subject">Назва предмету</label>
            <input type="text" id="subject" placeholder="Наприклад: Програмування">
        </div>

        <div class="input-group">
            <label for="teacher">Викладач</label>
            <input type="text" id="teacher" placeholder="Прізвище та ініціали">
        </div>

        <div class="input-group">
            <label for="day">День тижня</label>
            <select id="day">
                <option value="Пн">Понеділок</option>
                <option value="Вв">Вівторок</option>
                <option value="Ср">Середа</option>
                <option value="Чт">Четвер</option>
                <option value="Пт">П'ятниця</option>
            </select>
        </div>

        <div class="input-group">
            <label for="time">Час</label>
            <input type="time" id="time">
        </div>

        <button class="add-btn">Додати заняття</button>
    </div>

    <ul class="lesson-list">
            </div>
        </li>
    </ul>
</div>

<script src="script.js"></script>
</body>
</html>
